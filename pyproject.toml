[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memcanvas"
version = "0.1.0"
description = "Visual memory for lifelong multimodal agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
models = [
  "torch>=2.1",
  "transformers>=4.45",
  "datasets>=2.18",
  "tqdm>=4.66",
]
plots = [
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
include = ["memcanvas*"]
