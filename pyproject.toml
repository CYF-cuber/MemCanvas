[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memcanvas"
version = "0.1.0"
description = "Structured visual memory components for multimodal agent research."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
]

[tool.setuptools.packages.find]
include = ["memcanvas*"]
