model:
  vlm_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
  clip_name_or_path: openai/clip-vit-large-patch14

paths:
  data_root: ./data
  output_root: ./outputs
  memory_root: ./outputs/memory_bank

canvas:
  max_width: 960
  image_max_dim: 420
  text_ref_width: 600

retrieval:
  alpha: 0.75
  top_k: 2
  threshold: 0.1

forgetting:
  review_interval: 1000
  frequency_threshold: 0
  quality_scales: [1.0, 0.75, 0.5, 0.25, 0.0]

evaluation:
  deterministic: true
  max_new_tokens: 64
